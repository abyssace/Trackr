<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trackr</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1100px;
      margin: 1rem auto;
      padding: 0 0.75rem 2rem;
      color: #222;
    }
    h1 { margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    .box {
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    input[type="text"], input[type="password"] {
      padding: 0.5rem;
      margin-right: 0.5rem;
      min-width: 180px;
    }
    button {
      min-height: 44px;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }
    #messages {
      height: 320px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 0.5rem;
      padding: 0.75rem;
      background: #fafafa;
      margin-bottom: 0.75rem;
    }
    .msg {
      margin-bottom: 0.75rem;
      padding: 0.5rem;
      border-radius: 0.4rem;
    }
    .msg.user {
      background: #e6f4ea;
      text-align: right;
    }
    .msg.assistant {
      background: #fff;
      border: 1px solid #eee;
    }
    .msg.system {
      background: #fff3cd;
      font-size: 0.9rem;
    }
    .row {
      display: flex;
      gap: 0.5rem;
    }
    #messageInput {
      flex: 1;
      padding: 0.5rem;
    }
    .hidden { display: none; }
    .app-nav { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .app-nav button[aria-current="page"] { background: #2563eb; color: white; border: 0; }
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.75rem; }
    .inventory-kpi { border: 1px solid #ddd; border-radius: 0.65rem; padding: 0.9rem; min-height: 75px; }
    .inventory-kpi strong { display: block; font-size: 1.25rem; margin-top: 0.25rem; overflow-wrap: anywhere; }
    .inventory-search { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .inventory-search input { flex: 1; min-width: 0; min-height: 48px; padding: 0.7rem; }
    .product-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0.75rem; }
    .product-card { border: 1px solid #ddd; border-left: 6px solid #2e7d32; border-radius: 0.65rem; padding: 0.9rem; overflow-wrap: anywhere; }
    .product-card.low-stock { border-left-color: #c62828; background: #fff7f7; }
    .product-card .warning { color: #8a5a00; background: #fff4d6; padding: 0.5rem; border-radius: 0.4rem; }
    .muted { color: #666; }
    #categoryChart { width: 100%; height: auto; min-height: 80px; }
    .status-message { padding: 0.8rem; border-radius: 0.5rem; background: #f4f6f8; }
    @media (max-width: 560px) {
      body { margin-top: 0.5rem; }
      h1 { font-size: 1.6rem; }
      .box { padding: 0.8rem; }
      .inventory-search { flex-direction: column; }
      .inventory-search button { width: 100%; }
      #messages { height: 38vh; min-height: 220px; }
    }
  </style>
</head>
<body>
  <h1>Trackr</h1>
  <p class="subtitle">Tu negocio, a voz o por chat.</p>

  <div id="loginBox" class="box">
    <h3>Iniciar sesión</h3>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Usuario" required />
      <input type="password" id="password" placeholder="Contraseña" required />
      <button type="submit">Entrar</button>
    </form>
    <p id="loginError" style="color: #c00;"></p>
  </div>

  <nav id="appNav" class="app-nav hidden" aria-label="Secciones de Trackr">
    <button id="showChatBtn" type="button" aria-current="page">Chat</button>
    <button id="showInventoryBtn" type="button">Inventario</button>
  </nav>

  <div id="chatBox" class="box hidden">
    <div class="row" style="justify-content: space-between; align-items: center;">
      <h3>Chat</h3>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
    <div id="messages"></div>
    <form id="chatForm" class="row">
      <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off" required />
      <button type="submit">Enviar</button>
    </form>
    <div id="pendingActions" class="box hidden" style="margin-top: 0.75rem;">
      <p id="pendingSummary" style="margin: 0 0 0.5rem 0; white-space: pre-line;"></p>
      <div class="row">
        <button id="confirmBtn" style="background:#2e7d32;color:#fff;">Confirmar</button>
        <button id="cancelBtn" style="background:#c62828;color:#fff;">Cancelar</button>
      </div>
    </div>
  </div>

  <main id="inventoryBox" class="hidden">
    <section class="box" aria-labelledby="inventoryTitle">
      <h2 id="inventoryTitle">Inventario</h2>
      <p class="muted">Consulta productos, existencias y alertas. El stock se calcula con los movimientos registrados.</p>
      <div id="inventoryKpis" class="inventory-grid" aria-live="polite"></div>
      <div class="box">
        <h3>Existencias por categoría</h3>
        <svg id="categoryChart" viewBox="0 0 640 100" role="img" aria-label="Gráfica de existencias por categoría"></svg>
        <p id="chartEmpty" class="muted hidden">Todavía no hay productos para mostrar.</p>
      </div>
      <label for="productSearch"><strong>Buscar producto</strong></label>
      <form id="productSearchForm" class="inventory-search" role="search">
        <input id="productSearch" type="search" placeholder="Nombre, categoría o código de barras" autocomplete="off" />
        <button type="submit">Buscar</button>
      </form>
      <p id="inventoryMessage" class="status-message" role="status">Cargando inventario…</p>
      <div id="productList" class="product-list" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const loginBox = document.getElementById('loginBox');
    const chatBox = document.getElementById('chatBox');
    const loginForm = document.getElementById('loginForm');
    const chatForm = document.getElementById('chatForm');
    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const pendingActions = document.getElementById('pendingActions');
    const pendingSummary = document.getElementById('pendingSummary');
    const confirmBtn = document.getElementById('confirmBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const appNav = document.getElementById('appNav');
    const inventoryBox = document.getElementById('inventoryBox');
    const inventoryKpis = document.getElementById('inventoryKpis');
    const categoryChart = document.getElementById('categoryChart');
    const chartEmpty = document.getElementById('chartEmpty');
    const productSearch = document.getElementById('productSearch');
    const productSearchForm = document.getElementById('productSearchForm');
    const productList = document.getElementById('productList');
    const inventoryMessage = document.getElementById('inventoryMessage');

    let eventSource = null;
    let searchTimer = null;

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function checkSession() {
      try {
        const res = await fetch('/api/me', { credentials: 'same-origin' });
        if (res.ok) {
          await showChat();
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/historial', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        messages.innerHTML = '';
        data.forEach(m => addMessage(m.contenido, m.rol));
      } catch (e) {
        console.error(e);
      }
    }

    async function showChat() {
      loginBox.classList.add('hidden');
      appNav.classList.remove('hidden');
      chatBox.classList.remove('hidden');
      inventoryBox.classList.add('hidden');
      document.getElementById('showChatBtn').setAttribute('aria-current', 'page');
      document.getElementById('showInventoryBtn').removeAttribute('aria-current');
      await loadHistory();
      connectEvents();
    }

    async function showInventory() {
      loginBox.classList.add('hidden');
      appNav.classList.remove('hidden');
      chatBox.classList.add('hidden');
      inventoryBox.classList.remove('hidden');
      document.getElementById('showInventoryBtn').setAttribute('aria-current', 'page');
      document.getElementById('showChatBtn').removeAttribute('aria-current');
      await loadInventorySummary();
      await loadProducts(productSearch.value);
    }

    document.getElementById('showChatBtn').addEventListener('click', showChat);
    document.getElementById('showInventoryBtn').addEventListener('click', showInventory);

    function connectEvents() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource('/api/eventos', { withCredentials: true });
      eventSource.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        if (data.tipo === 'recordatorio') {
          addMessage(`⏰ Recordatorio: ${data.texto}`, 'system');
        } else if (data.tipo === 'ping') {
          // keep-alive, no mostrar
        }
      };
      eventSource.onerror = () => {
        console.warn('SSE error, reconectando...');
      };
    }

    function showLogin() {
      chatBox.classList.add('hidden');
      inventoryBox.classList.add('hidden');
      appNav.classList.add('hidden');
      loginBox.classList.remove('hidden');
      if (eventSource) eventSource.close();
    }

    function monedaMx(valor) {
      return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(valor));
    }

    function agregarKpi(etiqueta, valor) {
      const card = document.createElement('div');
      card.className = 'inventory-kpi';
      const label = document.createElement('span');
      label.className = 'muted';
      label.textContent = etiqueta;
      const value = document.createElement('strong');
      value.textContent = valor;
      card.append(label, value);
      inventoryKpis.appendChild(card);
    }

    async function loadInventorySummary() {
      inventoryKpis.replaceChildren();
      try {
        const response = await fetch('/api/inventario/resumen', { credentials: 'same-origin' });
        if (!response.ok) throw new Error('No se pudo cargar el resumen.');
        const data = await response.json();
        agregarKpi('Productos activos', String(data.total_productos));
        agregarKpi('Productos con alerta roja', String(data.productos_bajo_minimo));
        if (Object.hasOwn(data, 'valor_inventario_costo_mxn')) {
          agregarKpi('Valor a costo (MXN)', monedaMx(data.valor_inventario_costo_mxn));
          agregarKpi('Productos sin precio de compra', String(data.productos_sin_precio_compra));
        }
        if (Object.hasOwn(data, 'valor_inventario_venta_mxn')) {
          agregarKpi('Valor a precio de venta (MXN)', monedaMx(data.valor_inventario_venta_mxn));
          agregarKpi('Productos sin precio de venta', String(data.productos_sin_precio_venta));
        }
        drawCategoryChart(data.stock_por_categoria || []);
      } catch (error) {
        agregarKpi('Resumen', 'No disponible');
      }
    }

    function drawCategoryChart(rows) {
      categoryChart.replaceChildren();
      chartEmpty.classList.toggle('hidden', rows.length > 0);
      if (!rows.length) {
        categoryChart.setAttribute('viewBox', '0 0 640 80');
        return;
      }
      const rowHeight = 34;
      const max = Math.max(1, ...rows.map(row => row.cantidad));
      categoryChart.setAttribute('viewBox', `0 0 640 ${rows.length * rowHeight + 8}`);
      rows.forEach((row, index) => {
        const y = index * rowHeight + 6;
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', '4'); label.setAttribute('y', String(y + 16));
        label.setAttribute('font-size', '13'); label.textContent = row.categoria;
        const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bar.setAttribute('x', '210'); bar.setAttribute('y', String(y));
        bar.setAttribute('width', String(Math.max(2, 360 * row.cantidad / max)));
        bar.setAttribute('height', '22'); bar.setAttribute('rx', '4');
        bar.setAttribute('fill', '#2563eb');
        const count = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        count.setAttribute('x', String(220 + 360 * row.cantidad / max));
        count.setAttribute('y', String(y + 16)); count.setAttribute('font-size', '13');
        count.textContent = String(row.cantidad);
        categoryChart.append(label, bar, count);
      });
    }

    function renderProducts(products) {
      productList.replaceChildren();
      if (!products.length) {
        inventoryMessage.textContent = 'No encontramos productos con esa búsqueda.';
        inventoryMessage.classList.remove('hidden');
        return;
      }
      inventoryMessage.classList.add('hidden');
      products.forEach(product => {
        const card = document.createElement('article');
        card.className = `product-card${product.bajo_minimo ? ' low-stock' : ''}`;
        const title = document.createElement('h3'); title.textContent = product.nombre;
        const details = document.createElement('p');
        details.className = 'muted';
        details.textContent = [product.categoria || 'Sin categoría', product.codigo || 'Sin código', product.proveedor || 'Sin proveedor'].join(' · ');
        const stock = document.createElement('p');
        stock.textContent = `Existencia física: ${product.stock_actual}${product.unidad_medida ? ` ${product.unidad_medida}` : ''}`;
        const minimum = document.createElement('p');
        minimum.textContent = product.stock_minimo === null ? 'Alerta mínima: sin configurar' : `Mínimo: ${product.stock_minimo}`;
        card.append(title, details, stock, minimum);
        if (product.bajo_minimo) {
          const red = document.createElement('p'); red.className = 'warning';
          red.textContent = 'Alerta: existencia física en el mínimo o por debajo.'; card.appendChild(red);
        }
        if (product.tipo === 'terminado') {
          const committed = document.createElement('p');
          committed.textContent = `Comprometido en pedidos: ${product.stock_comprometido}`;
          card.appendChild(committed);
          if (product.disponible_bajo_minimo) {
            const amber = document.createElement('p'); amber.className = 'warning';
            amber.textContent = `Advertencia: quedan ${product.stock_disponible} disponibles después de pedidos comprometidos.`;
            card.appendChild(amber);
          }
        }
        if (Object.hasOwn(product, 'precio_compra')) {
          const cost = document.createElement('p');
          cost.textContent = product.precio_compra === null ? 'Precio de compra pendiente' : `Precio de compra: ${monedaMx(product.precio_compra)}`;
          card.appendChild(cost);
        }
        if (Object.hasOwn(product, 'precio_venta')) {
          const sale = document.createElement('p');
          sale.textContent = product.precio_venta === null ? 'Precio de venta pendiente' : `Precio de venta: ${monedaMx(product.precio_venta)}`;
          card.appendChild(sale);
        }
        productList.appendChild(card);
      });
    }

    async function loadProducts(query = '') {
      inventoryMessage.textContent = 'Buscando productos…';
      inventoryMessage.classList.remove('hidden');
      try {
        const url = new URL('/api/inventario/productos', window.location.origin);
        if (query.trim()) url.searchParams.set('q', query.trim());
        const response = await fetch(url, { credentials: 'same-origin' });
        if (!response.ok) throw new Error('No se pudo cargar el catálogo.');
        const data = await response.json();
        renderProducts(data.productos || []);
      } catch (error) {
        productList.replaceChildren();
        inventoryMessage.textContent = error.message || 'Ocurrió un error al consultar el inventario.';
        inventoryMessage.classList.remove('hidden');
      }
    }

    productSearch.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadProducts(productSearch.value), 120);
    });
    productSearch.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        clearTimeout(searchTimer);
        loadProducts(productSearch.value);
      }
    });
    productSearchForm.addEventListener('submit', event => {
      event.preventDefault();
      clearTimeout(searchTimer);
      loadProducts(productSearch.value);
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) {
        showChat();
      } else {
        loginError.textContent = 'Credenciales inválidas';
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      messageInput.value = '';
      messageInput.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ mensaje: text }),
        });
        if (!res.ok) {
          const err = await res.json();
          addMessage(`Error: ${err.detail || res.statusText}`, 'system');
        } else {
          const data = await res.json();
          addMessage(data.reply, 'assistant');
        }
      } catch (err) {
        addMessage(`Error de red: ${err.message}`, 'system');
      } finally {
        messageInput.disabled = false;
        messageInput.focus();
        await checkPending();
      }
    });

    async function checkPending() {
      try {
        const res = await fetch('/api/pendiente', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        if (data.pendiente) {
          pendingSummary.textContent = data.resumen + '\n\n(Expira en 5 minutos)';
          pendingActions.classList.remove('hidden');
          chatForm.classList.add('hidden');
        } else {
          hidePending();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function hidePending() {
      pendingActions.classList.add('hidden');
      chatForm.classList.remove('hidden');
      pendingSummary.textContent = '';
    }

    confirmBtn.addEventListener('click', async () => {
      confirmBtn.disabled = true;
      try {
        const res = await fetch('/api/confirmar', { method: 'POST', credentials: 'same-origin' });
        if (!res.ok) {
          const err = await res.json();
          addMessage(`Error: ${err.detail || res.statusText}`, 'system');
        } else {
          const data = await res.json();
          addMessage(data.resultado, 'assistant');
        }
      } catch (err) {
        addMessage(`Error de red: ${err.message}`, 'system');
      } finally {
        confirmBtn.disabled = false;
        hidePending();
      }
    });

    cancelBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/cancelar', { method: 'POST', credentials: 'same-origin' });
        addMessage('Acción cancelada.', 'assistant');
      } catch (err) {
        addMessage(`Error de red: ${err.message}`, 'system');
      }
      hidePending();
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      showLogin();
    });

    // Revisar acción pendiente después de cada respuesta del chat y al cargar.
    const originalShowChat = showChat;
    showChat = async function() {
      await originalShowChat();
      await checkPending();
    };

    checkSession();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>
</body>
</html>
