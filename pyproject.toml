[project]
name = "trackr"
version = "0.1.0"
description = "Asistente web para gestionar inventario, pedidos, clientes y empleados con comandos de voz o texto."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Por definir" }
authors = [
    { name = "Trackr Team" },
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.1.3",
    "alembic==1.14.0",
    "apscheduler==3.10.4",
    "langchain==0.3.14",
    "langchain-core==0.3.29",
    "langchain-openai==0.2.14",
    "openai==1.59.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[project.scripts]
trackr = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
